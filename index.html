<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Nodos y Ofertas - Tigo Ejecutivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pantalla de Bienvenida y Seguridad -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <div class="login-header">
                <h2>Bienvenido a tu Buscador Tigo Ejecutivo</h2>
                <p>Ingresa la contraseña para acceder</p>
            </div>
            <form id="loginForm" onsubmit="validarAcceso(event)">
                <input type="password" id="passwordInput" placeholder="Ingresa el password..." required autocomplete="off">
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
            <p id="errorMessage" class="error-msg"></p>
        </div>
    </div>

    <!-- Contenido Principal (Oculto hasta iniciar sesión) -->
    <div id="appContent" class="app-content hidden">
        <header class="header">
            <h1>Consulta de Nodos y Cobertura</h1>
            <p>Busca por municipio, urbanización, pasaje o número de nodo</p>
        </header>

        <main class="container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Ej: Ilopango Selt-Sut ILO8...">
            </div>

            <div class="category-filters" id="categoryFilters">
                <button class="filter-btn active" data-category="todas">Todas</button>
                <button class="filter-btn" data-category="Focalizada">Focalizada</button>
                <button class="filter-btn" data-category="Cablera Oriente">Cablera Oriente</button>
                <button class="filter-btn" data-category="Nacional">Nacional / Estándar</button>
            </div>

            <section class="cards-grid" id="resultsContainer">
                <!-- Contenido dinámico generado con script.js -->
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
