<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Nodos KML</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        <div class="search-card">
            <h2>Buscador de Nodos y Zonas</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Escribe el nombre del nodo o zona..." autocomplete="off">
                <ul id="resultsList"></ul>
            </div>
            <div id="nodeInfo" class="node-info">
                <p>Escribe al menos 2 letras en el buscador para encontrar un nodo y ver sus detalles.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
